<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Breeze ASR 上傳測試</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;max-width:880px;margin:24px auto;padding:0 16px}
.card{border:1px solid #ddd;border-radius:12px;padding:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{padding:8px 14px;border-radius:8px;border:1px solid #333;background:#111;color:#fff;cursor:pointer}
button.secondary{background:#fff;color:#111}
textarea{width:100%;min-height:220px} pre{white-space:pre-wrap;background:#f6f6f6;padding:10px;border-radius:8px}
small{color:#666}
</style></head><body>
<h2>ggml-breeze-asr-26 音檔上傳測試</h2>
<div class="card">
  <div class="row">
    <input id="file" type="file" accept=".wav,.mp3,.m4a,.flac,.ogg" />
    <select id="format">
      <option value="txt">純文字 (TXT)</option>
      <option value="srt">字幕檔 (SRT)</option>
      <option value="vtt">字幕檔 (VTT)</option>
    </select>
    <label for="max_len" style="margin-left:8px">段落限長:</label>
    <input id="max_len" type="number" value="20" style="width:50px" title="每個段落的最大字數" />
    <label style="margin-left:8px"><input id="sow" type="checkbox" checked disabled /> 詞彙切分 (優化)</label>
    <button id="go">開始轉錄</button>
    <button id="cancel" class="secondary" disabled>取消</button>
  </div>
  <p id="status"></p>
  <div id="results" style="display:none">
    <small id="paths"></small><br/>
    <a id="link-txt" href="#" target="_blank" style="display:none">TXT</a>
    <a id="link-srt" href="#" target="_blank" style="display:none">SRT</a>
    <a id="link-vtt" href="#" target="_blank" style="display:none">VTT</a>
  </div>
  <h4>轉錄結果</h4>
  <textarea id="text" placeholder="結果會出現在這裡"></textarea>
  <h4>執行 Log（尾段）</h4>
  <pre id="log"></pre>
</div>
<script>
const statusEl=document.getElementById('status');
const textEl=document.getElementById('text');
const logEl=document.getElementById('log');
const pathsEl=document.getElementById('paths');
const resultsDiv=document.getElementById('results');
const btnGo=document.getElementById('go');
const btnCancel=document.getElementById('cancel');
let jobId=null, timer=null;

function setBusy(b){ btnGo.disabled=b; btnCancel.disabled=!b; }

async function poll(){
  if(!jobId) return;
  const r=await fetch(`/api/jobs/${jobId}`);
  const j=await r.json();
  if(!j.ok){ statusEl.textContent='查詢失敗'; return; }
  statusEl.textContent = `狀態: ${j.status}，耗時 ${j.elapsed_sec}s，PID ${j.pid||'-'}`;
  pathsEl.textContent = `上傳: ${j.input_path||''}`;
  logEl.textContent = j.log_tail || '';
  if(j.status==='done'){
    textEl.value = j.text || '';
    resultsDiv.style.display = 'block';
    // Update links (we assume they exist if transcription is done)
    const formats = ['txt', 'srt', 'vtt'];
    formats.forEach(ext => {
      const link = document.getElementById(`link-${ext}`);
      link.href = `/api/jobs/${jobId}/download?ext=${ext}`;
      link.style.display = 'inline';
      link.textContent = `${ext.toUpperCase()} 下載`;
    });
    clearInterval(timer); timer=null; setBusy(false);
  } else if(['failed','cancelled'].includes(j.status)){
    clearInterval(timer); timer=null; setBusy(false);
  }
}

btnGo.onclick=async()=>{
  const f=document.getElementById('file').files[0];
  const fmt=document.getElementById('format').value;
  const maxLen=document.getElementById('max_len').value;
  if(!f){alert('請先選音檔');return}
  
  statusEl.textContent='準備上傳...'; textEl.value=''; logEl.textContent=''; pathsEl.textContent='';
  resultsDiv.style.display='none';
  setBusy(true);

  const chunkSize = 512 * 1024; // 512KB
  const totalChunks = Math.ceil(f.size / chunkSize);
  const uploadId = Date.now() + '-' + Math.random().toString(36).substring(2, 9);
  
  for (let i = 0; i < totalChunks; i++) {
    const start = i * chunkSize;
    const end = Math.min(start + chunkSize, f.size);
    const chunk = f.slice(start, end);
    
    const fd = new FormData();
    fd.append('upload_id', uploadId);
    fd.append('chunk_index', i);
    fd.append('file', chunk, 'chunk.bin'); 
    
    let success = false;
    let retryCount = 0;
    while (!success && retryCount < 10) {
      try {
        const response = await fetch('/api/upload_chunk', {
          method: 'POST',
          body: fd
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        success = true;
      } catch (err) {
        retryCount++;
        if (retryCount >= 10) {
          statusEl.textContent=`上傳失敗 (段 ${i+1}/${totalChunks}): ${err.message} (已重試10次)`;
          setBusy(false);
          return;
        }
        statusEl.textContent=`段 ${i+1}/${totalChunks} 失敗，正在自動重試 (${retryCount}/10)...`;
        await new Promise(r => setTimeout(r, 1000 * retryCount)); // Exponential backoff
      }
    }
    const percent = Math.round(((i + 1) / totalChunks) * 100);
    statusEl.textContent = `檔案上傳中... ${percent}%`;
    // small sleep between chunks to avoid congestion
    await new Promise(r => setTimeout(r, 100));
  }

  statusEl.textContent = `伺服器組裝檔案中...`;
  
  const fd2 = new FormData();
  fd2.append('upload_id', uploadId);
  fd2.append('filename', f.name);
  fd2.append('format', fmt);
  fd2.append('max_len', maxLen);

  try {
    const r=await fetch('/api/transcribe',{method:'POST',body:fd2});
    const j=await r.json();
    if(!j.ok){ statusEl.textContent='失敗: '+(j.error||'unknown'); setBusy(false); return; }
    jobId=j.job_id;
    statusEl.textContent=`音檔上傳完成！開始分析與切片... (job_id=${jobId})`;
    await poll();
    timer=setInterval(poll, 2000);
  } catch (err) {
    statusEl.textContent='解析伺服器回應失敗';
    setBusy(false);
  }
};

btnCancel.onclick=async()=>{
  if(!jobId) return;
  await fetch(`/api/jobs/${jobId}/cancel`, {method:'POST'});
  await poll();
};
</script></body></html>
